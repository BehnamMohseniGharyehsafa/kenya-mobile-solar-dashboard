name: Model and dashboard checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the project
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-core.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare off-screen 3D rendering
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1 libegl1 libxrender1
      - name: Test the energy model and dashboard
        run: xvfb-run -a python -m pytest -q
        env:
          PYVISTA_OFF_SCREEN: 'true'
          MPLBACKEND: Agg

  dependency-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: requirements-cloud.txt

  cloud-container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the public simulation image
        run: docker build -t solar-cloud .
      - name: Start within the free service memory allowance
        run: docker run -d --name solar-cloud --memory=512m -p 10000:10000 solar-cloud
      - name: Verify weather cache permissions as the application user
        run: >-
          docker exec solar-cloud python -c
          "from solar_model.live_weather import CACHE;
          CACHE.mkdir(parents=True,exist_ok=True);
          probe=CACHE/'permission-check';
          probe.write_text('ok');
          assert probe.read_text()=='ok';
          probe.unlink();
          print('Weather cache is writable by the application user:',CACHE)"
      - name: Exercise the real public scene and callback
        run: docker exec solar-cloud python -m tools.smoke_cloud http://127.0.0.1:10000
      - name: Record memory and diagnostics
        if: always()
        run: |
          docker stats --no-stream solar-cloud
          docker inspect --format '{{json .State}}' solar-cloud
          docker logs --tail 70 solar-cloud
