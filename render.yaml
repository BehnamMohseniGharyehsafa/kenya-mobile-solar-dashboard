services:
  - type: web
    name: behnamproject-pvforafrica
    runtime: docker
    plan: free
    branch: master
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeployTrigger: 'off'
    envVars:
      - key: PV_MAX_SESSIONS
        value: "2"
      - key: PV_WEATHER_CACHE_DIR
        value: /tmp/solar-weather
      - key: PV_UI_REVISION
        value: smooth-fan-v2
